<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hemingway Bench 榜单</title>
<link rel="icon" href="favicon.ico">
<script src="vendor/tailwind-browser.js"></script>
<style type="text/tailwindcss">
  @theme {
    --color-ink: #17272B;
    --color-paper: #F7F8F7;
    --color-sea: #0E7C7B;
    --color-cinnabar: #B3402A;
    --color-fog: #64747A;
    --color-rule: #D8DEDD;
    --font-display: Georgia, "Songti SC", "STSong", "SimSun", serif;
    --font-data: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
</style>
<script src="vendor/vue.global.min.js"></script>
<script src="vendor/echarts.min.js"></script>
<style>
  [v-cloak] { display: none; }
  body { font-family: -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .row-hover:hover { background: #EDF2F1; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body class="bg-paper text-ink min-h-screen">
<div id="app" v-cloak>

  <!-- 电报纸头 -->
  <header class="border-b-2 border-ink">
    <div class="max-w-4xl mx-auto px-4 pt-8 pb-5">
      <p class="font-data text-xs tracking-[0.3em] text-fog uppercase">Surge · Hemingway Bench</p>
      <h1 class="font-display text-3xl sm:text-4xl mt-2 text-ink">海明威写作榜</h1>
      <p class="mt-2 text-sm text-fog" v-if="latest">
        快照 <span class="font-data">{{ latest.captured_at }}</span>（UTC） ·
        共 {{ latest.entries.length }} 个模型 ·
        <a class="text-sea underline underline-offset-2" href="https://surgehq.ai/benchmarks/hemingway-bench" target="_blank" rel="noopener">原页面</a>
      </p>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-6">

    <!-- 加载 / 错误 -->
    <div v-if="loading" class="py-24 text-center text-fog font-data text-sm">正在拉取榜单数据……</div>
    <div v-else-if="error" class="py-16 text-center">
      <p class="text-cinnabar font-data text-sm">{{ error }}</p>
      <button @click="load" class="mt-4 px-4 py-2 border border-ink text-sm hover:bg-ink hover:text-paper transition-colors">重试</button>
    </div>

    <!-- ============ 榜单视图 ============ -->
    <template v-else-if="view === 'list'">
      <div class="flex gap-6 border-b border-rule mb-4">
        <button v-for="t in tabs" :key="t.key" @click="tab = t.key"
          class="pb-2 text-sm transition-colors -mb-px border-b-2"
          :class="tab === t.key ? 'border-ink text-ink font-medium' : 'border-transparent text-fog hover:text-ink'">
          {{ t.label }}
          <span class="font-data text-xs" :class="t.key === 'china' ? 'text-cinnabar' : 'text-fog'">{{ t.count }}</span>
        </button>
      </div>

      <table class="w-full text-sm">
        <thead>
          <tr class="text-left text-fog border-b border-rule">
            <th class="py-2 pr-2 font-normal w-14">排名</th>
            <th class="py-2 pr-2 font-normal w-24">厂商</th>
            <th class="py-2 pr-2 font-normal">模型</th>
            <th class="py-2 px-2 font-normal text-right w-16">分数</th>
            <th class="py-2 pl-2 font-normal text-right w-24 hidden sm:table-cell">区间</th>
            <th class="py-2 pl-2 font-normal text-right w-14" title="与上一快照对比">趋势</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="e in visibleEntries" :key="e.brand + e.model" class="border-b border-rule/60 row-hover">
            <td class="py-2 pr-2 font-data">{{ e.rank }}</td>
            <td class="py-2 pr-2 text-fog">{{ e.brand }}</td>
            <td class="py-2 pr-2">
              <button @click="openModel(e)" class="text-left hover:text-sea underline decoration-rule underline-offset-4 hover:decoration-sea transition-colors">{{ e.model }}</button>
            </td>
            <td class="py-2 px-2 text-right font-data">{{ e.score }}</td>
            <td class="py-2 pl-2 text-right font-data text-fog hidden sm:table-cell">{{ e.score_low }}–{{ e.score_high }}</td>
            <td class="py-2 pl-2 text-right font-data text-xs">
              <template v-if="deltaOf(e) < 0"><span class="text-sea">▲{{ -deltaOf(e) }}</span></template>
              <template v-else-if="deltaOf(e) > 0"><span class="text-cinnabar">▼{{ deltaOf(e) }}</span></template>
              <template v-else><span class="text-rule">—</span></template>
            </td>
          </tr>
        </tbody>
      </table>
      <p v-if="snapshots.length < 2" class="mt-4 text-xs text-fog font-data">
        目前仅 {{ snapshots.length }} 份快照，排名走势将随每日快照逐步累积。
      </p>
    </template>

    <!-- ============ 模型走势视图 ============ -->
    <template v-else>
      <button @click="backToList" class="font-data text-sm text-fog hover:text-sea transition-colors">← 返回榜单</button>

      <div class="mt-4 flex items-end justify-between flex-wrap gap-2">
        <div>
          <p class="font-data text-xs tracking-widest text-fog uppercase">{{ selected.brand }}</p>
          <h2 class="font-display text-2xl sm:text-3xl mt-1">{{ selected.model }}</h2>
        </div>
        <div class="text-right">
          <p class="font-data text-4xl text-sea leading-none" v-if="bestRank">#{{ bestRank }}</p>
          <p class="text-xs text-fog mt-1">历史最高排名 · 分数 {{ selected.score }}</p>
        </div>
      </div>

      <div class="mt-6 border border-rule bg-white">
        <div class="w-full h-96" ref="chartEl"></div>
      </div>

      <table class="w-full text-sm mt-6" v-if="modelHistory.length">
        <thead>
          <tr class="text-left text-fog border-b border-rule">
            <th class="py-2 font-normal">快照时间（UTC）</th>
            <th class="py-2 font-normal text-right">排名</th>
            <th class="py-2 font-normal text-right">分数</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="h in modelHistory" :key="h.at" class="border-b border-rule/60">
            <td class="py-2 font-data">{{ h.at }}</td>
            <td class="py-2 text-right font-data">{{ h.rank }}</td>
            <td class="py-2 text-right font-data">{{ h.score }}</td>
          </tr>
        </tbody>
      </table>
    </template>
  </main>

  <footer class="max-w-4xl mx-auto px-4 pb-10 pt-4">
    <p class="text-xs text-fog font-data">数据源 surgehq.ai · 每日 8:00（北京时间）快照 · 中国模型榜按厂商关键词筛选，仅供参考</p>
  </footer>
</div>

<script>
const { createApp, ref, computed, onMounted, nextTick } = Vue;

const API_BASE = "https://hemingway-bench-watcher.earlzhang.workers.dev";
const CHINA_BRANDS = ["Kimi", "GLM", "DeepSeek", "Qwen", "Hy"];

createApp({
  setup() {
    const loading = ref(true);
    const error = ref("");
    const snapshots = ref([]);
    const view = ref("list");
    const tab = ref("all");
    const selected = ref(null);
    const chartEl = ref(null);
    let chart = null;

    const latest = computed(() => snapshots.value.at(-1) ?? null);

    const chinaFilter = (list) => list.filter((e) => CHINA_BRANDS.includes(e.brand));
    const visibleEntries = computed(() => {
      const list = latest.value ? latest.value.entries : [];
      return tab.value === "china" ? chinaFilter(list) : list;
    });

    const tabs = computed(() => [
      { key: "all", label: "总榜", count: latest.value ? latest.value.entries.length : 0 },
      { key: "china", label: "中国模型", count: latest.value ? chinaFilter(latest.value.entries).length : 0 },
    ]);

    // 与上一快照对比的名次变化（负数=上升）
    const prevMap = computed(() => {
      if (snapshots.value.length < 2) return new Map();
      const prev = snapshots.value.at(-2).entries;
      return new Map(prev.map((e) => [`${e.brand}||${e.model}`, e.rank]));
    });
    const deltaOf = (e) => {
      const prev = prevMap.value.get(`${e.brand}||${e.model}`);
      return prev === undefined ? 0 : e.rank - prev;
    };

    const modelHistory = computed(() => {
      if (!selected.value) return [];
      const out = [];
      for (const s of snapshots.value) {
        const hit = s.entries.find((e) => e.brand === selected.value.brand && e.model === selected.value.model);
        if (hit) out.push({ at: s.captured_at, rank: hit.rank, score: hit.score });
      }
      return out;
    });
    const bestRank = computed(() => modelHistory.value.length ? Math.min(...modelHistory.value.map((h) => h.rank)) : null);

    async function fetchJSON(url, timeoutMs = 10000) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        const res = await fetch(url, { signal: ctrl.signal });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      } finally {
        clearTimeout(timer);
      }
    }

    async function load() {
      loading.value = true;
      error.value = "";
      try {
        // 同源优先（线上 tools.earlmind.com 由 Worker 路由承接），失败回退 workers.dev
        let data;
        try {
          data = await fetchJSON("/api/history", 5000);
        } catch {
          data = await fetchJSON(`${API_BASE}/api/history`);
        }
        if (!data.snapshots || !data.snapshots.length) throw new Error("暂无快照数据");
        snapshots.value = data.snapshots;
      } catch (e) {
        error.value = `数据加载失败：${e.message}。请检查网络后重试。`;
      } finally {
        loading.value = false;
      }
    }

    function openModel(entry) {
      selected.value = { brand: entry.brand, model: entry.model, score: entry.score };
      view.value = "model";
      nextTick(renderChart);
    }

    function backToList() {
      view.value = "list";
      selected.value = null;
    }

    function renderChart() {
      if (!chartEl.value) return;
      if (chart) chart.dispose();
      chart = echarts.init(chartEl.value);
      const dates = modelHistory.value.map((h) => h.at.slice(5, 10));
      const ranks = modelHistory.value.map((h) => h.rank);
      const maxRank = Math.max(...ranks);
      chart.setOption({
        grid: { left: 48, right: 24, top: 32, bottom: 36 },
        tooltip: {
          trigger: "axis",
          formatter: (ps) => {
            const p = ps[0];
            const h = modelHistory.value[p.dataIndex];
            return `${h.at}<br/>排名 <b>#${h.rank}</b> · 分数 ${h.score}`;
          },
        },
        xAxis: { type: "category", data: dates, axisLabel: { color: "#64747A" }, axisLine: { lineStyle: { color: "#D8DEDD" } } },
        yAxis: {
          type: "value", inverse: true, min: 1, max: Math.max(maxRank + 1, 5), interval: 1,
          axisLabel: { color: "#64747A", formatter: (v) => `#${v}` },
          splitLine: { lineStyle: { color: "#EDF2F1" } },
        },
        series: [{
          type: "line", data: ranks, step: "middle",
          lineStyle: { color: "#0E7C7B", width: 2 },
          itemStyle: { color: "#0E7C7B" },
          symbolSize: 8,
          label: { show: true, position: "top", formatter: (p) => `#${p.value}`, color: "#17272B", fontFamily: "ui-monospace, Menlo, monospace", fontSize: 11 },
        }],
      });
    }

    onMounted(load);

    return { loading, error, view, tab, tabs, selected, chartEl, latest, snapshots,
             visibleEntries, modelHistory, bestRank,
             deltaOf, load, openModel, backToList };
  },
}).mount("#app");
</script>
</body>
</html>
